<main class="grid min-h-dvh place-items-center bg-slate-100 px-4 py-10">
    <section class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/60 sm:p-10">
        <div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-slate-950 text-xl font-semibold text-white">C</div>
        <h1 class="mt-6 text-center text-2xl font-semibold tracking-tight text-slate-950">Bienvenido al chat</h1>
        <p class="mt-2 text-center text-sm leading-6 text-slate-500">Inicia sesión con Google para conversar con otros usuarios registrados.</p>

        <button
            *ngIf="!sessionActive"
            type="button"
            class="mt-8 flex w-full items-center justify-center gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 disabled:cursor-wait disabled:opacity-60"
            [disabled]="loading"
            (click)="login()">
            <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15Z"/>
                <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.9 1.3-4.2 2.1-6.8 2.1-5.2 0-9.6-3.5-11.2-8.2H5.9v5.3A20 20 0 0 0 24 44Z"/>
                <path fill="#FBBC05" d="M12.8 27.9a12 12 0 0 1 0-7.8v-5.3H5.9a20 20 0 0 0 0 18.4l6.9-5.3Z"/>
                <path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 5.8 29.5 4 24 4A20 20 0 0 0 5.9 14.8l6.9 5.3c1.6-4.7 6-8.2 11.2-8.2Z"/>
            </svg>
            Continuar con Google
        </button>

        <p *ngIf="error" class="mt-5 rounded-xl bg-slate-50 p-3 text-center text-sm text-slate-600" role="status">{{ error }}</p>
        <p *ngIf="info" class="mt-5 rounded-xl bg-blue-50 p-3 text-center text-sm text-blue-800" role="status">{{ info }}</p>
        <p *ngIf="loading" class="mt-5 text-center text-xs text-slate-400">Comprobando sesión...</p>
        <button
            *ngIf="sessionActive"
            type="button"
            class="mt-4 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2"
            (click)="logout()">
            Cerrar sesión
        </button>
        <p class="mt-8 text-center text-xs leading-5 text-slate-400">Tu perfil se usará para identificarte en las conversaciones.</p>
    </section>
</main>
