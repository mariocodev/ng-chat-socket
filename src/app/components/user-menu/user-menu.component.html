<details class="relative">
	<summary
		class="flex cursor-pointer list-none items-center rounded-xl transition hover:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 dark:hover:bg-slate-900 dark:focus:ring-slate-600"
		[ngClass]="compact ? 'h-10 w-10 justify-center rounded-full bg-slate-100 p-0 text-slate-700 dark:bg-slate-800 dark:text-slate-100' : 'gap-3 p-3'"
		style="list-style: none"
	>
		<span
			class="relative grid shrink-0 place-items-center rounded-full bg-slate-900 text-sm font-semibold text-white dark:bg-slate-700"
			[ngClass]="compact ? 'h-8 w-8' : 'h-10 w-10'"
		>
			<ng-content select="[avatar]"></ng-content>
		</span>
		@if (!compact) {
			<span class="min-w-0 flex-1">
				<span class="block truncate text-sm font-medium text-slate-800 dark:text-slate-100">{{ userName || 'Mi cuenta' }}</span>
				<span class="block truncate text-xs text-slate-500 dark:text-slate-400">{{ userEmail }}</span>
			</span>
			<svg class="h-4 w-4 text-slate-400 dark:text-slate-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
				<path fill-rule="evenodd" d="M5.22 7.47a.75.75 0 0 1 1.06 0L10 11.19l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 8.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
			</svg>
		}
	</summary>
	<div
		class="absolute z-30 rounded-xl border border-slate-200 bg-white p-2 shadow-xl dark:border-slate-700 dark:bg-slate-900"
		[ngClass]="compact ? 'right-0 top-full mt-2 w-64' : 'bottom-full left-0 mb-2 w-full'"
		role="menu"
		aria-label="Menú de usuario"
	>
		<div class="px-3 py-2 text-sm font-medium text-slate-800 dark:text-slate-100" role="menuitem">Perfil</div>
		<div class="px-3 py-2 text-sm text-slate-600 dark:text-slate-300" role="menuitem">Configuración</div>
		<div class="px-2 py-2" role="menuitem" aria-label="Tema">
			<div class="mb-1 px-1 text-xs text-slate-500 dark:text-slate-400">Tema</div>
			<div class="flex rounded-lg bg-slate-100 p-1 text-xs dark:bg-slate-800">
				<button type="button" class="flex-1 rounded-md px-2 py-1" [ngClass]="themeMode() === 'light' ? 'bg-white text-slate-800 shadow-sm dark:bg-slate-700 dark:text-slate-100' : 'text-slate-600 dark:text-slate-300'" (click)="setThemeMode('light')">Claro</button>
				<button type="button" class="flex-1 rounded-md px-2 py-1" [ngClass]="themeMode() === 'dark' ? 'bg-white text-slate-800 shadow-sm dark:bg-slate-700 dark:text-slate-100' : 'text-slate-600 dark:text-slate-300'" (click)="setThemeMode('dark')">Oscuro</button>
				<button type="button" class="flex-1 rounded-md px-2 py-1" [ngClass]="themeMode() === 'system' ? 'bg-white text-slate-800 shadow-sm dark:bg-slate-700 dark:text-slate-100' : 'text-slate-600 dark:text-slate-300'" (click)="setThemeMode('system')">Sistema</button>
			</div>
		</div>
		<div class="my-1 border-t border-slate-200 dark:border-slate-700"></div>
		<button
			type="button"
			class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium text-red-600 transition hover:bg-red-50 dark:hover:bg-red-900/20"
			role="menuitem"
			(click)="onLogout()"
		>
			Cerrar sesión
		</button>
	</div>
</details>
